<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><title>Bridge 状态预览</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#1c1f27);--ink:light-dark(#161a22,#e9ecf2);--sub:light-dark(#5a6372,#9aa3b2);--line:light-dark(#e2e5ea,#2a2f3a);--soft:light-dark(#f1f3f6,#232731);--accent:light-dark(#0f766e,#4fd1c0);--accent-ink:light-dark(#fff,#062a26);--ok:light-dark(#15803d,#4ade80);--warn:light-dark(#b45309,#fbbf24);--bad:light-dark(#c02626,#f87171);--idle:light-dark(#6b7280,#8b93a3)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;padding:14px 16px;display:flex;flex-direction:column;gap:12px;font:13px/1.45 "Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
header{display:flex;align-items:center;justify-content:space-between}header strong{font-size:14px}
#label{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}#label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}#label.off::before{background:var(--bad)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}li{display:flex;align-items:center;gap:8px;font-size:12.5px}li i{width:7px;height:7px;border-radius:50%;background:var(--idle);flex:none}li span{flex:1}li small{color:var(--sub)}
li.ok i{background:var(--ok)}li.warn i{background:var(--warn)}li.warn small{color:var(--warn)}li.bad i{background:var(--bad)}li.bad small{color:var(--bad)}
section{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}section div{background:var(--soft);border-radius:8px;padding:6px 10px;display:grid}section small{color:var(--sub);font-size:11.5px}b{font:600 18px "Segoe UI";font-variant-numeric:tabular-nums}#issues.hot{color:var(--bad)}
footer{display:flex;gap:8px;margin-top:auto}button{cursor:pointer;border:0;border-radius:7px;padding:6px 12px;font:inherit}#open{flex:1;background:var(--accent);color:var(--accent-ink);font-weight:600}#quit{background:transparent;color:var(--sub)}#quit:hover{background:var(--soft);color:var(--ink)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body><header><strong>Desktop Agent Bridge</strong><span id="label" role="status">正在读取…</span></header>
<ul id="apps"></ul>
<section><div><small>待处理</small><b id="pending">—</b></div><div><small>已确认</small><b id="read">—</b></div><div><small>需检查</small><b id="issues">—</b></div></section>
<footer><button id="open">打开控制台</button><button id="quit">退出控制台</button></footer></body></html>
