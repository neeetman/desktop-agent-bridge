<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'"><title>Bridge 状态预览</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:16px 18px;font:13px "Segoe UI","Microsoft YaHei",sans-serif;background:light-dark(#f7f8fc,#222738);color:light-dark(#232940,#edf0fa)}header,section,footer{display:flex;align-items:center;justify-content:space-between}header strong{font-size:17px}small{color:light-dark(#5b677f,#bcbdd2)}#label{font-size:11px;color:light-dark(#256c60,#b8ebde)}section{margin:15px 0;padding:10px 14px;border:1px solid light-dark(#d6dbea,#41445e);border-radius:9px}section div{display:grid;gap:2px}b{font:600 22px "Segoe UI";font-variant-numeric:tabular-nums}button{cursor:pointer;color:white;background:#5952ae;border:0;border-radius:6px;padding:7px 13px}#quit{background:transparent;color:light-dark(#535f77,#c9cadb)}button:focus-visible{outline:2px solid #bdc7ff}
</style></head><body><header><strong>Desktop Bridge</strong><span id="label" role="status">正在读取…</span></header>
<section><div><small>待处理</small><b id="pending">—</b></div><div><small>已确认</small><b id="read">—</b></div><div><small>需检查</small><b id="issues">—</b></div></section>
<footer><button id="open">打开控制台</button><button id="quit">退出控制台</button></footer></body></html>
